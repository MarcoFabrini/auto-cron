monolog:
    channels:
        - deprecation

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #console:
            #    type: console
            #    process_psr_3_messages: false
            #    channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # stdout JSON formatter — log aggregator-friendly (#3.4).
            # Output: { "datetime": "...", "level_name": "ERROR", "message": "...", "context": {...}, "extra": {...} }
            # Docker raccoglie da stdout → driver (json-file, fluentd, gelf, ecc).
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            nested:
                type: stream
                path: "php://stdout"
                level: debug
                formatter: monolog.formatter.json
            # Deprecation log separato in stderr (rumore minore)
            deprecation:
                type: stream
                path: "php://stderr"
                channels: [deprecation]
                level: notice
                formatter: monolog.formatter.json
