nelmio_api_doc:
    documentation:
        info:
            title: AutoCron API
            description: |
                REST JSON API for AutoCron vehicle fleet management.
                Auth: JWT dual-channel (HttpOnly cookie web / Bearer mobile via `X-Client-Type` header).
                Multi-tenant: every business resource scoped to active `organization_id` claim.
            version: 1.0.0
        servers:
            - url: http://localhost
              description: Local dev
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - Bearer: []
    areas:
        default:
            path_patterns:
                - ^/api(?!/doc)
            disable_default_routes: true
