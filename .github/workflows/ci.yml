name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (PHPUnit + PHPStan)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: autocron
          MARIADB_ROOT_PASSWORD: ci_test_root_password
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 5

    env:
      APP_ENV: test
      APP_DEBUG: '0'
      APP_SECRET: ci_test_secret_dummy
      DATABASE_URL: mysql://root:ci_test_root_password@127.0.0.1:3306/autocron?serverVersion=mariadb-11.4.0&charset=utf8mb4
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      JWT_PASSPHRASE: ci_test_jwt_passphrase
      CORS_ALLOW_ORIGIN: '^https?://localhost(:[0-9]+)?$'

    steps:
      - uses: actions/checkout@v4

      - name: Install mariadb-client (mariadb-dump)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl, zip, opcache, bcmath
          coverage: none
          tools: composer:v2
          ini-values: upload_max_filesize=11M, post_max_size=11M

      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: vendor-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate JWT keys
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Create + migrate test DB
        run: |
          php bin/console doctrine:database:create --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction

      - name: PHPUnit
        run: php bin/phpunit

      - name: Warm up dev container cache (for phpstan-symfony)
        env:
          APP_DEBUG: '1'
        run: php bin/console cache:warmup --env=dev

      - name: PHPStan
        run: php vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  images:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Owner lowercase
        id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/autocron-app:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/autocron-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
