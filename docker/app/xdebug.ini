xdebug.mode = develop,debug
; "trigger": il debugger si connette solo se la richiesta lo chiede (XDEBUG_TRIGGER / cookie XDEBUG_SESSION).
; Con "yes" ogni richiesta e ogni test PHPUnit tentava la connessione a host.docker.internal prima di partire.
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log_level = 0
